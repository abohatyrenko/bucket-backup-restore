apiVersion: v2
name: bucket-backup-restore
description: Scheduled backups of S3-compatible buckets (or any rclone remote) into encrypted archives, with retention and restore
type: application

# The chart and the image share one version: version, appVersion and the image in
# artifacthub.io/images below must be equal (checked by scripts/check-version.sh).
version: 1.0.1
appVersion: "1.0.1"

kubeVersion: ">=1.21.0-0"
home: https://github.com/abohatyrenko/bucket-backup-restore
sources:
  - https://github.com/abohatyrenko/bucket-backup-restore
icon: https://raw.githubusercontent.com/rclone/rclone/master/graphics/logo/logo_symbol/logo_symbol_color_256px.png
keywords:
  - s3
  - bucket
  - backup
  - restore
  - rclone
  - digitalocean-spaces
  - cronjob
maintainers:
  - name: Anatolii Bohatyrenko
    url: https://github.com/abohatyrenko

annotations:
  artifacthub.io/displayName: S3 Bucket Backup & Restore
  artifacthub.io/category: storage
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/abohatyrenko/bucket-backup-restore
    - name: Documentation
      url: https://github.com/abohatyrenko/bucket-backup-restore#readme
    - name: Docker image
      url: https://hub.docker.com/r/abohatyrenko/bucket-backup-restore
  artifacthub.io/images: |
    - name: bucket-backup-restore
      image: abohatyrenko/bucket-backup-restore:1.0.1
  artifacthub.io/changes: |
    - kind: fixed
      description: Images are built without layer cache, so Alpine package security fixes always get into the image
    - kind: added
      description: NOTES show how to list backups
    - kind: changed
      description: Maintenance cleanups in the chart templates and CI from postgresql-backup-restore 1.0.3, no behaviour changes
