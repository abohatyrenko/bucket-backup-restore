apiVersion: v2
name: bucket-backup-restore
description: Scheduled backups of S3-compatible buckets (or any rclone remote) into encrypted archives, with retention and restore
type: application

# The chart and the image share one version: version, appVersion and the image in
# artifacthub.io/images below must be equal (checked by scripts/check-version.sh).
version: 2.0.0
appVersion: "2.0.0"

kubeVersion: ">=1.21.0-0"
home: https://github.com/abohatyrenko/bucket-backup-restore
sources:
  - https://github.com/abohatyrenko/bucket-backup-restore
icon: https://raw.githubusercontent.com/rclone/rclone/master/graphics/logo/logo_symbol/logo_symbol_color_256px.png
keywords:
  - s3
  - bucket
  - backup
  - restore
  - rclone
  - digitalocean-spaces
  - cronjob
maintainers:
  - name: Anatolii Bohatyrenko
    url: https://github.com/abohatyrenko

annotations:
  artifacthub.io/displayName: S3 Bucket Backup & Restore
  artifacthub.io/category: storage
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/abohatyrenko/bucket-backup-restore
    - name: Documentation
      url: https://github.com/abohatyrenko/bucket-backup-restore#readme
    - name: Docker image
      url: https://hub.docker.com/r/abohatyrenko/bucket-backup-restore
  artifacthub.io/images: |
    - name: bucket-backup-restore
      image: abohatyrenko/bucket-backup-restore:2.0.0
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking: Secret keys are named after the variables they set (AWS_ACCESS_KEY_ID, AGE_IDENTITY, SLACK_WEBHOOK_URL); see Upgrading to 2.0.0 in the README"
    - kind: changed
      description: "Breaking: the chart is published to oci://ghcr.io/abohatyrenko/charts, the Helm repository on GitHub Pages is gone"
    - kind: removed
      description: "Breaking: variable names deprecated in 1.0.0 (SRC_BUCKET, DST_BUCKET, BANDWITH_LIMIT, TRANSACTION_LIMIT)"
    - kind: added
      description: Values are validated with a JSON schema, a misspelled value fails the install
    - kind: fixed
      description: A backup or restore killed by SIGTERM (job deadline, pod eviction) is reported as failed to Slack and the heartbeat, not as a success
    - kind: fixed
      description: deployNotification no longer fails the release when the Secret has no SLACK_WEBHOOK_URL key; its pod follows nodeSelector and tolerations
