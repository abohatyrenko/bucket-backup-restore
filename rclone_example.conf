# Example rclone.conf. Mount it to /config/rclone/rclone.conf, or put its content into
# the `rclone` key of the Helm chart Secret. Remote names are used in SOURCE / DESTINATION /
# RESTORE_TARGET, e.g. SOURCE=spaces-fra1:my-bucket. See https://rclone.org/s3/ for all options.
#
# Prefer read-only keys for the source bucket in backup jobs.
#
# acl only applies to objects rclone creates, i.e. to restores. Set
#   acl = public-read
# on the restore target if the bucket serves public files (e.g. a CDN origin).

[spaces-fra1]
type = s3
provider = DigitalOcean
access_key_id =
secret_access_key =
endpoint = fra1.digitaloceanspaces.com

[yandex]
type = s3
provider = Other
access_key_id =
secret_access_key =
endpoint = storage.yandexcloud.net

[r2]
type = s3
provider = Cloudflare
access_key_id =
secret_access_key =
endpoint = https://<account-id>.r2.cloudflarestorage.com

# Destination in AWS S3 with credentials from the environment / IRSA,
# the same as DESTINATION=s3://bucket/path
[aws]
type = s3
provider = AWS
env_auth = true
region = eu-central-1
no_check_bucket = true
